# company.yaml — 통합 설정 파일
# 기존 TSV 파일(worker-definitions, worker-routing-keywords, worker-role-briefs)을 대체합니다.
# 레거시 TSV는 호환성 유지용으로 남겨두고, 새 스크립트는 이 파일을 기준으로 읽습니다.

version: "2"

# ──────────────────────────────────────────
# Evidence Kind SSOT (v0.3-alpha, additive)
# ──────────────────────────────────────────
# 왜: must_call_mcp(도구 카운트) 게이트의 단일 장애점·카운트 게임화·OAuth 종속을
#     해소하기 위해 "검증 가능한 증거 종류"를 1차 게이트로 도입한다.
# 운영: 이 섹션은 additive — 기존 워커 brief는 무수정 통과한다.
#     역할별 required/optional 매핑은 B2 단계(워커별 brief 변환)에서 채운다.
#     현재 단계(B1)는 enum SSOT + shadow validator만 도입한다.
# 마이그레이션: B1(현재) → B2(역할별 매핑) → B3(deprecation) → B4(must_call_mcp 제거)
evidence:
  kinds:
    - id: code_symbol_or_reference
      desc: 심볼/참조/호출관계 등 코드 경계 근거
    - id: repo_text_or_diff
      desc: rg·설정 원문·git diff 같은 저장소 텍스트 근거
    - id: external_spec_or_policy
      desc: RFC·사내정책·Notion 원문 등 외부 규격 근거
    - id: api_contract_or_schema
      desc: OpenAPI·SQL·JSON Schema·타입 정의 근거
    - id: runtime_log_or_trace
      desc: 로그·에러·트레이스·재현 출력 근거
    - id: static_vuln_scan
      desc: Semgrep·CodeQL·SARIF 자동 정적진단 근거
    - id: product_metric_lookup
      desc: PostHog·BI·warehouse 질의 결과 근거
    - id: experiment_or_feedback_artifact
      desc: 실험회고·인터뷰·ticket·CS 같은 사용자/실험 근거
    - id: dependency_or_sbom
      desc: lockfile·SBOM·advisory·버전 근거
    - id: architecture_or_decision_record
      desc: ADR·설계메모·승인/예외 기록 근거
  default_must_provide:
    minimum_distinct_kinds: 2
    required_kinds: []      # B2에서 역할별로 채움
    optional_kinds: []
    deferred_kinds: []      # 정의된 유예 상태(예: PostHog OAuth 미인증 시 product_metric_lookup)
  manifest_location: "workers/<worker>/evidence-manifest.yaml"
  expected_location: "workers/<worker>/expected-evidence.json"  # prepare-worker.sh가 떨굼
  validator:
    mode: primary           # shadow | primary  (B3~ — evidence gate가 1차 게이트)
    script: scripts/validate-evidence.sh
    exit_on_failure: true   # B4 — expected-gate 위반 시 approve 차단 (hard gate)
  # v0.3-alpha 마이그레이션 종료 (B4): must_call_mcp는 active config에 존재하지 않으며
  # audit_only_legacy_fields 메타도 더 이상 필요 없다. drafts/archive 사본만 잔존하나
  # 런타임 코드 경로는 아무 것도 참조하지 않음.

# ──────────────────────────────────────────
# Workers
# ──────────────────────────────────────────
workers:

  strategy-planner:
    display_name: 전략 플래너
    aliases: [strategy]
    profile: .company-kit/docs/profiles/strategy.md
    starter: .company-kit/templates/team-starters/strategy.md
    work_dirs:
      - project-work/00-project
      - project-work/01-planning
      - project-work/09-decisions
    routing:
      keywords: [전략, 우선순위, 수익성, revenue, pricing, roi, 투자, cost, budget, roadmap, direction, strategy, priority]
      priority_keywords: []
      default_support: [data-analyst, risk-reviewer]
    brief:
      mission: 사업 방향, 우선순위, 비용, 리스크를 경영 관점에서 판단 가능한 계획으로 정리한다.
      tasks: [market-case, finance-case, priority-review]
      deliverables: [방향성 요약, 우선순위 제안, 비용 메모, 리스크 메모]
      key_questions:
        - 왜 지금 이 안이 맞는가
        - 대체안보다 왜 우선인가
        - 비용과 리스크를 감안해도 유지할 가치가 있는가
      must_provide_evidence:  # v0.3-alpha B2 — stub_worker default 매핑
        minimum_distinct_kinds: 2
        required_kinds: [repo_text_or_diff, external_spec_or_policy]
        optional_kinds: [code_symbol_or_reference, architecture_or_decision_record]
        deferred_kinds: []
      mcp:  # R21 (축 1 / Phase 3)
        minimum_call: 3
        preferred_tools:
          - id: mcp__claude_ai_Notion__notion-search
            rationale: "notion-search: 전략 플래너의 의사결정 근거 저장소입니다. 이 도구 없이는 이전 방향 결정·ROI 메모·우선순위 맥락을 추측으로 판단하여 전략 오염의 위험을 통제할 수 없습니다."
          - id: mcp__plugin_context7_context7__query-docs
            rationale: "context7 query-docs: 전략 플래너의 외부 규격·정책 참조 도구입니다. 이 도구 없이는 산업 표준·규제 맥락 없이 비용·리스크 판단을 추측으로 내려 근거 없는 계획의 위험을 통제할 수 없습니다."
          - id: mcp__plugin_oh-my-claudecode_t__ast_grep_search
            rationale: "ast_grep_search: 전략 플래너의 코드 기반 비용·리스크 탐색 도구입니다. 이 도구 없이는 기술 부채·의존성 범위를 추측으로 산정하여 전략 판단 품질이 저하될 위험을 통제할 수 없습니다."
        prefetch_queries:
          - tool: mcp__claude_ai_Notion__notion-search
            query: "전략 방향 ROI 우선순위 의사결정"
            why: "직전 전략 결정 맥락 선점 로드"
          - tool: mcp__plugin_context7_context7__query-docs
            query: "business strategy prioritization framework"
            why: "외부 프레임워크 참조로 방향성 근거 보강"
          - tool: mcp__plugin_oh-my-claudecode_t__ast_grep_search
            query: "cost budget dependency config"
            why: "기술 비용 추정 근거 코드 식별"
        deferred:
          - tool: posthog
            reason: "OAuth 유예"
            fallback: "notion-search 로 내부 지표·실험 결과 메모 검색 + ast_grep_search 로 이벤트 전송 코드 위치 식별"
          - tool: stripe
            reason: "OAuth 유예"
            fallback: "notion-search 로 결제·수익 관련 의사결정 메모 + context7 query-docs 로 Stripe API 공식 사양 참조"

  service-planner:
    display_name: 서비스 플래너
    aliases: [planning, prd-planner]
    profile: .company-kit/docs/profiles/planning.md
    starter: .company-kit/templates/team-starters/planning.md
    work_dirs:
      - project-work/00-project
      - project-work/01-planning
      - project-work/02-design
    routing:
      keywords: [기획, prd, ux, 요구사항, requirement, user, flow, policy, scope, onboarding, checkout, payment, form, service, planner, 회고, retrospective, 메타, meta, 템플릿, template, 문서, docs, 전략문서, 방향, 업스트림, upstream, 기여, contribute]
      priority_keywords: []
      default_support: [brainstormer, strategy-planner]
    brief:
      mission: 요구사항, 범위, 사용자 흐름, 정책 예외를 제품 관점에서 구조화한다.
      tasks: [requirements, user-flow, policy-check]
      deliverables: [PRD 초안, 기능 구조, 사용자 흐름, 정책 메모]
      key_questions:
        - 사용자가 정확히 무엇을 하게 되는가
        - 기능 경계는 어디까지인가
        - 가장 위험한 UX 가정은 무엇인가
      must_provide_evidence:  # v0.3-alpha B2 — stub_worker default 매핑
        minimum_distinct_kinds: 2
        required_kinds: [repo_text_or_diff, external_spec_or_policy]
        optional_kinds: [code_symbol_or_reference, architecture_or_decision_record]
        deferred_kinds: []
      mcp:  # R21 (축 1 / Phase 3)
        minimum_call: 3
        preferred_tools:
          - id: mcp__claude_ai_Notion__notion-search
            rationale: "notion-search: 서비스 플래너의 요구사항·정책 근거 저장소입니다. 이 도구 없이는 사용자 흐름·정책 예외 맥락을 추측으로 채워 요구사항 오염의 위험을 통제할 수 없습니다."
          - id: mcp__plugin_context7_context7__query-docs
            rationale: "context7 query-docs: 서비스 플래너의 UX 패턴·API 사양 참조 도구입니다. 이 도구 없이는 인터페이스 설계 근거 없이 기능 범위를 추측으로 결정하여 품질 저하의 위험을 통제할 수 없습니다."
          - id: mcp__plugin_oh-my-claudecode_t__ast_grep_search
            rationale: "ast_grep_search: 서비스 플래너의 기존 구현 범위 확인 도구입니다. 이 도구 없이는 중복 기능·기존 정책 코드를 발견하지 못해 범위 추측의 위험을 통제할 수 없습니다."
        prefetch_queries:
          - tool: mcp__claude_ai_Notion__notion-search
            query: "PRD 요구사항 정책 사용자 흐름 기능 범위"
            why: "기존 기획 문서 선점 로드로 중복 정의 방지"
          - tool: mcp__plugin_context7_context7__query-docs
            query: "user flow UX design pattern requirement specification"
            why: "UX 패턴 참조로 기능 경계 근거 보강"
          - tool: mcp__plugin_oh-my-claudecode_t__ast_grep_search
            query: "policy rule validation form flow"
            why: "기존 정책·폼 흐름 코드 식별"
        deferred:
          - tool: posthog
            reason: "OAuth 유예"
            fallback: "notion-search 로 내부 제품 지표·사용자 피드백 메모 + ast_grep_search 로 이벤트 전송 코드 위치 식별"
          - tool: figma
            reason: "OAuth 유예"
            fallback: "notion-search 로 디자인 의사결정 메모 + context7 query-docs 로 컴포넌트 라이브러리 공식 문서 참조"

  brainstormer:
    display_name: 브레인스토머
    aliases: [brainstorm]
    profile: .company-kit/docs/profiles/brainstorm.md
    starter: .company-kit/templates/team-starters/brainstorm.md
    work_dirs:
      - project-work/00-project
      - project-work/01-planning
      - project-work/02-design
      - project-work/09-decisions
    routing:
      keywords: [아이디어, 브레인스토밍, 대안, 옵션, 실험, 주제, 후보, ideation, brainstorm, options, alternatives]
      priority_keywords: []
      default_support: [service-planner, strategy-planner]
    brief:
      mission: 대안을 넓게 펼치고 찬반 논점을 부딪혀 다음 검증 질문을 만든다.
      tasks: [options, objections, reality-check]
      deliverables: [아이디어 후보, 찬반 논점, 핵심 리스크, 다음 검증 질문]
      key_questions:
        - 어떤 대안이 있는가
        - 각 대안의 가장 큰 장점과 실패 가능성은 무엇인가
        - 지금 바로 검증할 질문은 무엇인가
      must_provide_evidence:  # v0.3-alpha B2 — brainstormer 매핑
        minimum_distinct_kinds: 2
        required_kinds: [experiment_or_feedback_artifact, repo_text_or_diff]
        optional_kinds: [external_spec_or_policy, product_metric_lookup]
        deferred_kinds: []
      mcp:  # R21 (축 1 / Phase 3)
        minimum_call: 3
        preferred_tools:
          - id: mcp__claude_ai_Notion__notion-search
            rationale: "notion-search: 브레인스토머의 아이디어 맥락 저장소입니다. 이 도구 없이는 이전 실험·피드백·대안 후보를 추측으로 복원하여 아이디에이션 오염의 위험을 통제할 수 없습니다."
          - id: mcp__plugin_context7_context7__query-docs
            rationale: "context7 query-docs: 브레인스토머의 기술·시장 패턴 참조 도구입니다. 이 도구 없이는 대안 검토 시 외부 레퍼런스 없이 추측으로 찬반 논점을 구성하여 품질 저하의 위험을 통제할 수 없습니다."
          - id: mcp__plugin_oh-my-claudecode_t__ast_grep_search
            rationale: "ast_grep_search: 브레인스토머의 기존 구현 대안 탐색 도구입니다. 이 도구 없이는 코드베이스 내 기존 패턴을 발견하지 못해 실현 가능성 판단을 추측으로 내려 오염의 위험을 통제할 수 없습니다."
        prefetch_queries:
          - tool: mcp__claude_ai_Notion__notion-search
            query: "아이디어 실험 대안 후보 피드백 회고"
            why: "이전 브레인스토밍 결과 선점 로드"
          - tool: mcp__plugin_context7_context7__query-docs
            query: "product alternatives innovation experiment patterns"
            why: "외부 레퍼런스로 대안 품질 보강"
          - tool: mcp__plugin_oh-my-claudecode_t__ast_grep_search
            query: "feature flag experiment toggle variant"
            why: "기존 실험 인프라 코드 식별"
        deferred:
          - tool: posthog
            reason: "OAuth 유예"
            fallback: "notion-search 로 내부 실험·피드백 결과 메모 + ast_grep_search 로 이벤트 코드 위치 식별"

  fullstack-architect:
    display_name: 풀스택 아키텍트
    aliases: [engineering, architecture]
    profile: .company-kit/docs/profiles/engineering.md
    starter: .company-kit/templates/team-starters/engineering.md
    work_dirs:
      - project-work/00-project
      - project-work/03-frontend
      - project-work/04-backend
      - project-work/06-erd
    routing:
      keywords: [아키텍처, architecture, system, design, 구조, 설계, mvp, fullstack, boundary, backend, frontend, erd]
      priority_keywords: [api, contract]
      default_support: [frontend-engineer, backend-engineer, qa-reviewer]
    brief:
      mission: 프론트엔드, 백엔드, 데이터 흐름을 통합해 구현 구조와 기술 리스크를 분해한다.
      tasks: [frontend-boundary, backend-boundary, data-flow]
      deliverables: [아키텍처 초안, 구현 분해, 경계 정의, 기술 리스크]
      key_questions:
        - 구현 단위가 어떻게 나뉘는가
        - 가장 큰 기술 리스크는 어디인가
        - 어디서 프론트엔드와 백엔드 책임이 갈리는가
      must_provide_evidence:  # v0.3-alpha B2 — backend 매핑
        minimum_distinct_kinds: 2
        required_kinds: [code_symbol_or_reference, external_spec_or_policy]
        optional_kinds: [api_contract_or_schema, runtime_log_or_trace, architecture_or_decision_record]
        deferred_kinds: []
      mcp:  # R21 (축 1 / Phase 3)
        minimum_call: 3
        preferred_tools:
          - id: mcp__plugin_oh-my-claudecode_t__ast_grep_search
            rationale: "ast_grep_search: 풀스택 아키텍트의 코드 지형도입니다. 이 도구 없이는 프론트·백 경계 정의·데이터 흐름·의존성 범위를 추측으로 판단하여 아키텍처 오염의 위험을 통제할 수 없습니다."
          - id: mcp__plugin_oh-my-claudecode_t__lsp_workspace_symbols
            rationale: "lsp_workspace_symbols: 풀스택 아키텍트의 심볼 전역 탐색 도구입니다. 이 도구 없이는 인터페이스·타입·계약 심볼을 추측으로 매핑하여 경계 오염의 위험을 통제할 수 없습니다."
          - id: mcp__plugin_oh-my-claudecode_t__lsp_goto_definition
            rationale: "lsp_goto_definition: 풀스택 아키텍트의 정의 추적 도구입니다. 이 도구 없이는 API 계약·타입 원점을 추측으로 참조하여 설계 근거 없는 판단의 위험을 통제할 수 없습니다."
          - id: mcp__plugin_context7_context7__query-docs
            rationale: "context7 query-docs: 풀스택 아키텍트의 공식 SDK·프레임워크 사양 참조 도구입니다. 이 도구 없이는 통합 설계 시 공식 계약 없이 추측으로 구조를 결정하여 품질 저하의 위험을 통제할 수 없습니다."
        prefetch_queries:
          - tool: mcp__plugin_oh-my-claudecode_t__ast_grep_search
            query: "api route handler controller service repository"
            why: "프론트·백 경계 패턴 식별"
          - tool: mcp__plugin_oh-my-claudecode_t__lsp_workspace_symbols
            query: "interface type contract schema"
            why: "전역 타입 계약 심볼 선점 로드"
          - tool: mcp__plugin_context7_context7__query-docs
            query: "fullstack architecture API design system integration"
            why: "통합 설계 공식 레퍼런스 확보"
        deferred:
          - tool: posthog
            reason: "OAuth 유예"
            fallback: "notion-search 로 내부 제품 지표 메모 + ast_grep_search 로 이벤트 전송 코드 위치 식별"
          - tool: sentry
            reason: "OAuth 유예"
            fallback: "ast_grep_search 로 repo 내 error handling / try-catch / panic 패턴 + context7 query-docs 로 프레임워크 공식 error taxonomy 참조"

